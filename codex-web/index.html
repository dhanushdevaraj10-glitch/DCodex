        <script>
            function toggleMenu(e) {
                if (e) e.stopPropagation();
                var toggle = document.getElementById('menu-toggle');
                var nav = document.getElementById('nav-links');
                if (toggle && nav) {
                    toggle.classList.toggle('open');
                    var isOpen = nav.classList.toggle('open');
                    if (isOpen) {
                        document.body.classList.add('menu-open');
                    } else {
                        document.body.classList.remove('menu-open');
                    }
                }
            }
            function initBlessingTypewriter() {
                var el = document.getElementById('home-typewriter-text');
                if (!el) return;
                var fullText = "Sri Hethai Amman ☔";
                var charIndex = 0;
                var isDeleting = false;
                el.textContent = "";

                function tick() {
                    if (!isDeleting) {
                        charIndex++;
                        el.textContent = fullText.slice(0, charIndex);
                        if (charIndex === fullText.length) {
                            isDeleting = true;
                            setTimeout(tick, 7000);
                        } else {
                            setTimeout(tick, 75);
                        }
                    } else {
                        charIndex--;
                        el.textContent = fullText.slice(0, charIndex);
                        if (charIndex === 0) {
                            isDeleting = false;
                            setTimeout(tick, 600);
                        } else {
                            setTimeout(tick, 35);
                        }
                    }
                }
                setTimeout(tick, 300);
            }
            initBlessingTypewriter();

            document.addEventListener('click', function(e) {
                var toggle = document.getElementById('menu-toggle');
                var nav = document.getElementById('nav-links');
                if (toggle && nav && !nav.contains(e.target) && !toggle.contains(e.target)) {
                    toggle.classList.remove('open');
                    nav.classList.remove('open');
                    document.body.classList.remove('menu-open');
                }
            });
        </script>
